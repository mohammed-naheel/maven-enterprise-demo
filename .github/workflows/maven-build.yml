
name: Maven Build and Nginx Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build Maven project
        run: mvn clean install

      - name: Verify website file
        run: test -f app-module/src/main/resources/static/index.html

      - name: Stage website
        run: |
          mkdir -p /tmp/maven-enterprise-site
          cp app-module/src/main/resources/static/index.html /tmp/maven-enterprise-site/index.html

      - name: Deploy website to Nginx
        run: |
          sudo /usr/local/bin/deploy-maven-site.sh /tmp/maven-enterprise-site/index.html

      - name: Verify Nginx website
        run: |
          curl --fail -H "Host: myapp.local" http://localhost/
